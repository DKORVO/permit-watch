services:
  permit-watch:
    build: .
    image: permit-watch:local
    container_name: permit-watch
    ports:
      - "8080:8080"
    environment:
      # Leave blank to disable enrichment. Keep this secret in TrueNAS, not in sources.json.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-360}
      ENRICHMENT_DAILY_LIMIT: ${ENRICHMENT_DAILY_LIMIT:-100}
      CLOSED_RETENTION_DAYS: ${CLOSED_RETENTION_DAYS:-90}
      DIGEST_HOUR: ${DIGEST_HOUR:-8}
      DIGEST_MINUTE: ${DIGEST_MINUTE:-0}
      DIGEST_EMAIL_TO: ${DIGEST_EMAIL_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      TZ: ${TZ:-America/Toronto}
    volumes:
      # Create this dataset/path first and place sources.json in it.
      - /mnt/tank/apps/permit-watch:/data
    restart: unless-stopped
